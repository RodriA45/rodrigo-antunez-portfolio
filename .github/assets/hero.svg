<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Rodrigo Antúnez — Full Stack Developer Portfolio">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="55%" stop-color="#0c111d"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="1196" height="336" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @keyframes floatBlue {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(35px, -18px) scale(1.08); }
    }
    @keyframes floatEmerald {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-30px, 18px) scale(1.1); }
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.35); }
    }
    @keyframes beamMove {
      0% { transform: translateX(-420px); }
      100% { transform: translateX(1200px); }
    }

    @keyframes roleOne {
      0%, 2% { opacity: 0; transform: translateY(8px); }
      6%, 28% { opacity: 1; transform: translateY(0px); }
      33%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes roleTwo {
      0%, 33% { opacity: 0; transform: translateY(8px); }
      38%, 61% { opacity: 1; transform: translateY(0px); }
      66%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes roleThree {
      0%, 66% { opacity: 0; transform: translateY(8px); }
      71%, 94% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    @keyframes dotFocus1 {
      0%, 22% { r: 7.5; stroke-opacity: 1; }
      25%, 100% { r: 5.5; stroke-opacity: 0; }
    }
    @keyframes dotFocus2 {
      0%, 24% { r: 5.5; stroke-opacity: 0; }
      27%, 47% { r: 7.5; stroke-opacity: 1; }
      50%, 100% { r: 5.5; stroke-opacity: 0; }
    }
    @keyframes dotFocus3 {
      0%, 49% { r: 5.5; stroke-opacity: 0; }
      52%, 72% { r: 7.5; stroke-opacity: 1; }
      75%, 100% { r: 5.5; stroke-opacity: 0; }
    }
    @keyframes dotFocus4 {
      0%, 74% { r: 5.5; stroke-opacity: 0; }
      77%, 97% { r: 7.5; stroke-opacity: 1; }
      100% { r: 5.5; stroke-opacity: 0; }
    }

    .orb-blue { animation: floatBlue 9s ease-in-out infinite; transform-origin: 240px 110px; }
    .orb-emerald { animation: floatEmerald 11s ease-in-out infinite; transform-origin: 960px 230px; }
    .live-dot { animation: pulseLive 2s ease-in-out infinite; transform-origin: 964px 34px; }
    .beam { animation: beamMove 4.5s linear infinite; }

    .role-1 { animation: roleOne 9s ease-in-out infinite; }
    .role-2 { animation: roleTwo 9s ease-in-out infinite; }
    .role-3 { animation: roleThree 9s ease-in-out infinite; }

    .d1 { animation: dotFocus1 8s ease-in-out infinite; }
    .d2 { animation: dotFocus2 8s ease-in-out infinite; }
    .d3 { animation: dotFocus3 8s ease-in-out infinite; }
    .d4 { animation: dotFocus4 8s ease-in-out infinite; }
  </style>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="340" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#grid)"/>

    <circle class="orb-blue" cx="240" cy="110" r="260" fill="url(#glowBlue)"/>
    <circle class="orb-emerald" cx="960" cy="230" r="240" fill="url(#glowEmerald)"/>

    <!-- Top navbar bar -->
    <rect x="0" y="0" width="1200" height="68" fill="rgba(255,255,255,0.02)"/>
    <line x1="0" y1="68" x2="1200" y2="68" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Brand initials pill -->
    <rect x="44" y="21" width="38" height="26" rx="7" fill="rgba(59,130,246,0.16)" stroke="rgba(59,130,246,0.55)" stroke-width="1.2"/>
    <text x="63" y="39" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700" class="font-mono">RA</text>
    <text x="96" y="39" fill="#d4d4d8" font-size="14" font-weight="600" class="font-sans">rodrigo-antunez-portfolio</text>

    <!-- ThemeSwitcher animated dots -->
    <circle class="d1" cx="842" cy="34" r="5.5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0"/>
    <circle class="d2" cx="864" cy="34" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0"/>
    <circle class="d3" cx="886" cy="34" r="5.5" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0"/>
    <circle class="d4" cx="908" cy="34" r="5.5" fill="#f97316" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0"/>

    <!-- Live badge -->
    <rect x="944" y="21" width="212" height="26" rx="13" fill="rgba(16,185,129,0.10)" stroke="rgba(16,185,129,0.38)" stroke-width="1"/>
    <circle class="live-dot" cx="964" cy="34" r="4" fill="#10b981"/>
    <text x="1062" y="38.5" text-anchor="middle" fill="#34d399" font-size="11.5" font-weight="600" letter-spacing="0.6" class="font-mono">LIVE ON GITHUB PAGES</text>

    <!-- Center hero content -->
    <text x="600" y="148" text-anchor="middle" fill="url(#titleGrad)" font-size="50" font-weight="800" letter-spacing="-1" class="font-sans">Rodrigo Antúnez</text>
    <text x="600" y="190" text-anchor="middle" fill="#a1a1aa" font-size="22" font-weight="500" class="font-sans">Full Stack Developer — Software &amp; Web Engineering</text>

    <!-- Animated rotating stack ticker -->
    <rect x="275" y="220" width="650" height="44" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.11)" stroke-width="1"/>

    <g class="role-1">
      <text x="600" y="247" text-anchor="middle" fill="#60a5fa" font-size="15.5" font-weight="600" class="font-mono">React 19  ·  TypeScript  ·  Vite 8  ·  Framer Motion  ·  i18n</text>
    </g>
    <g class="role-2">
      <text x="600" y="247" text-anchor="middle" fill="#34d399" font-size="15.5" font-weight="600" class="font-mono">Python Backend  ·  REST APIs  ·  Web Scraping  ·  HLS / WebRTC</text>
    </g>
    <g class="role-3">
      <text x="600" y="247" text-anchor="middle" fill="#a78bfa" font-size="15.5" font-weight="600" class="font-mono">C# / .NET 8 WPF  ·  PostgreSQL / SQLite  ·  CI/CD Pipelines</text>
    </g>

    <!-- Bottom footer meta + moving accent beam -->
    <text x="600" y="302" text-anchor="middle" fill="#71717a" font-size="13" class="font-mono">ES / EN Bilingual  ·  4 Dynamic Color Accents  ·  Dual-Screen &amp; Mobile Responsive</text>

    <rect x="0" y="336" width="1200" height="4" fill="rgba(255,255,255,0.04)"/>
    <rect class="beam" x="0" y="336" width="420" height="4" fill="url(#accentLine)"/>
  </g>

  <rect x="2" y="2" width="1196" height="336" rx="18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
</svg>
